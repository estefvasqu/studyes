<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — StudyES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="page">
    <header class="dash-header">
      <div class="dash-header-top">
        <a href="index.html" class="back-link">← INICIO</a>
        <p class="site-date" id="dash-fecha"></p>
      </div>
      <h1 class="dash-title" id="dash-titulo">Cargando...</h1>
    </header>

    <nav class="tabs-nav" id="tabs-nav" role="tablist">
      <button class="tab-btn active" data-tab="hoy"      role="tab">HOY</button>
      <button class="tab-btn"        data-tab="temas"    role="tab">TEMAS</button>
      <button class="tab-btn"        data-tab="material" role="tab">MATERIAL</button>
      <button class="tab-btn"        data-tab="agregar"  role="tab">AGREGAR</button>
    </nav>

    <div id="panel-hoy"      class="tab-panel active"></div>
    <div id="panel-temas"    class="tab-panel"></div>
    <div id="panel-material" class="tab-panel"><p class="material-loading">Cargando archivos...</p></div>
    <div id="panel-agregar"  class="tab-panel"></div>
  </div>

  <script src="scripts/storage.js"></script>
  <script src="scripts/srs.js"></script>
  <script src="scripts/plan.js"></script>
  <script>
    // ── Estado global ───────────────────────────────────────────────
    const params     = new URLSearchParams(window.location.search);
    const materiaId  = params.get('materia') || 'micro2';
    let   materia    = null;
    let   cards      = [];
    let   materialCargado = false;
    // ── Estado guías ────────────────────────────────────────────────
    let   guiasData       = null;
    let   openGuias       = new Set();
    let   formAbiertoGuia = null;

    // ── Helpers ─────────────────────────────────────────────────────
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function truncar(str, max) {
      return str.length > max ? str.slice(0, max - 1) + '…' : str;
    }

    // ── Tabs ────────────────────────────────────────────────────────
    function initTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');

          if (btn.dataset.tab === 'material' && !materialCargado) {
            materialCargado = true;
            renderMaterial();
          }
        });
      });
    }

    // ── Tab HOY ─────────────────────────────────────────────────────
    function renderHoy() {
      const due = Plan.seleccionarHoy(cards);

      if (due.length === 0) {
        document.getElementById('panel-hoy').innerHTML =
          `<p class="hoy-empty">Estás al día ✓ — volvé mañana</p>`;
        return;
      }

      const items = due.map(c => {
        const srs = c.srs || {};
        let estadoClass, estadoLabel;
        if (srs.repetitions > 0) {
          estadoClass = 'estado-repasar'; estadoLabel = 'Repasar';
        } else if (srs.next_review && srs.next_review !== 0) {
          estadoClass = 'estado-debil';   estadoLabel = 'Débil';
        } else {
          estadoClass = 'estado-nueva';   estadoLabel = 'Nueva';
        }
        return `
          <li class="hoy-item">
            <span class="hoy-item-tema">${c.tema || 'Sin tema'}</span>
            <span class="hoy-item-frente">${truncar(c.frente, 60)}</span>
            <span class="hoy-item-estado ${estadoClass}">${estadoLabel}</span>
          </li>`;
      }).join('');

      document.getElementById('panel-hoy').innerHTML = `
        <div class="hoy-header">
          <span class="hoy-count">${due.length} card${due.length !== 1 ? 's' : ''} para repasar hoy</span>
          <a href="flashcards.html?materia=${materiaId}" class="btn-iniciar">INICIAR SESIÓN</a>
        </div>
        <ul class="hoy-list">${items}</ul>`;
    }

    // ── Tab TEMAS ────────────────────────────────────────────────────
    const SVG_ESTADO = {
      sinPracticar: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6.5" stroke="#ACBAC4" stroke-width="2"/></svg>`,
      debil:        `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2L14.5 14H1.5Z" fill="#B85C38"/><line x1="8" y1="6.5" x2="8" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="12" r="0.85" fill="white"/></svg>`,
      progreso:     `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7.5" stroke="#8B7355" stroke-width="1"/><path d="M8 0.5A7.5 7.5 0 0 0 8 15.5Z" fill="#8B7355"/></svg>`,
      dominado:     `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="8" fill="#5C7A5E"/><path d="M4.5 8.5L7 11L11.5 5.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    };

    function temaEstado(tCards) {
      const sinPracticar = tCards.every(c => !(c.srs?.repetitions) && (!c.srs?.next_review || c.srs.next_review === 0));
      if (sinPracticar)
        return { icono: SVG_ESTADO.sinPracticar, label: 'Sin practicar', color: '#9EA8B8' };

      const hayDebil = tCards.some(c => !(c.srs?.repetitions) && c.srs?.next_review && c.srs.next_review !== 0);
      if (hayDebil)
        return { icono: SVG_ESTADO.debil, label: 'Débil', color: '#C0604A' };

      const hayProgreso = tCards.some(c => (c.srs?.repetitions || 0) >= 1 && (c.srs?.repetitions || 0) < 3);
      if (hayProgreso)
        return { icono: SVG_ESTADO.progreso, label: 'En progreso', color: '#C9A84C' };

      return { icono: SVG_ESTADO.dominado, label: 'Dominado', color: '#5C7A5E' };
    }

    function renderTemas() {
      const mapa = {};
      cards.forEach(c => {
        const t = c.tema || 'Sin tema';
        if (!mapa[t]) mapa[t] = [];
        mapa[t].push(c);
      });

      if (Object.keys(mapa).length === 0) {
        document.getElementById('panel-temas').innerHTML =
          `<p class="empty-state">Todavía no hay tarjetas cargadas.</p>`;
        return;
      }

      const items = Object.entries(mapa).map(([tema, tCards]) => {
        const { icono, label, color } = temaEstado(tCards);
        const bg = hexToRgba(color, 0.10);
        return `
          <li class="tema-item">
            <span class="tema-icono">${icono}</span>
            <span class="tema-nombre">${tema}</span>
            <span class="tema-total">${tCards.length} card${tCards.length !== 1 ? 's' : ''}</span>
            <span class="tema-estado-badge" style="color:${color};background:${bg}">${label}</span>
          </li>`;
      }).join('');

      document.getElementById('panel-temas').innerHTML =
        `<ul class="temas-list">${items}</ul>`;
    }

    // ── Tab MATERIAL ─────────────────────────────────────────────────
    const SUBCARPETA_LABELS = {
      'Teoria':        'Teoría',
      'Ejercicios':    'Ejercicios',
      'Resumenes':     'Resúmenes',
      'Examenes':      'Exámenes',
      'Presentaciones':'Presentaciones',
      'Mapas_Mentales':'Mapas Mentales',
    };

    function tipoTag(tipo) {
      const t = tipo.toLowerCase();
      if (t === 'pdf')                       return `<span class="mat-emoji">📄</span>`;
      if (t === 'docx' || t === 'doc')       return `<span class="mat-emoji">📝</span>`;
      if (t === 'pptx' || t === 'ppt')       return `<span class="mat-emoji">📊</span>`;
      if (t === 'html')                      return `<span class="mat-emoji">🗺</span>`;
      if (t === 'xlsx' || t === 'xls')       return `<span class="mat-emoji">📊</span>`;
      return `<span class="mat-emoji">📎</span>`;
    }

    function grupoHTML(titulo, archivos) {
      const items = archivos.map(f => `
        <li class="material-item">
          ${tipoTag(f.tipo)}
          <span class="mat-nombre" title="${f.nombre}">${f.nombre}</span>
          <a href="${f.url}" target="_blank" rel="noopener" class="btn-abrir">ABRIR</a>
        </li>`).join('');
      return `
        <div class="material-grupo">
          <h3 class="material-grupo-titulo">${titulo}</h3>
          <ul class="material-list">${items}</ul>
        </div>`;
    }

    async function renderMaterial() {
      const panel = document.getElementById('panel-material');
      try {
        const res  = await fetch(`/api/material/${encodeURIComponent(materia.carpeta_material)}`);
        const data = await res.json();

        const hayGrupos = Object.keys(data.grupos || {}).length > 0;
        const haySueltos = (data.sin_subcarpeta || []).length > 0;

        if (!hayGrupos && !haySueltos) {
          panel.innerHTML = `<p class="material-empty">Todavía no hay archivos en esta carpeta.</p>`;
          return;
        }

        let html = '';
        for (const [sub, archivos] of Object.entries(data.grupos || {})) {
          html += grupoHTML(SUBCARPETA_LABELS[sub] || sub, archivos);
        }
        if (haySueltos) {
          html += grupoHTML('Otros', data.sin_subcarpeta);
        }
        panel.innerHTML = html;
      } catch (err) {
        panel.innerHTML = `<p class="material-empty">No se pudo cargar el material.<br>
          Verificá que el servidor esté corriendo.</p>`;
      }
    }

    // ── Tab AGREGAR ──────────────────────────────────────────────────
    function renderAgregar() {
      document.getElementById('panel-agregar').innerHTML = `
        <div class="agregar-form">
          <form id="form-agregar" novalidate autocomplete="off">
            <div class="form-group">
              <label class="form-label" for="f-tema">Tema</label>
              <input class="form-input" type="text" id="f-tema"
                placeholder="ej. Teoría de Juegos">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-frente">
                Frente <span class="form-req">*</span>
              </label>
              <textarea class="form-textarea" id="f-frente" rows="3"
                placeholder="Pregunta o concepto a recordar"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="f-dorso">
                Dorso <span class="form-req">*</span>
              </label>
              <textarea class="form-textarea" id="f-dorso" rows="3"
                placeholder="Respuesta o explicación"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="f-tags">Tags</label>
              <input class="form-input" type="text" id="f-tags"
                placeholder="ej. parcial, teoria, importante">
              <p class="form-hint">Separados por coma — opcional</p>
            </div>
            <button class="btn-agregar" type="submit">AGREGAR CARD</button>
            <p class="form-feedback" id="form-feedback"></p>
          </form>
        </div>`;

      document.getElementById('form-agregar').addEventListener('submit', async (e) => {
        e.preventDefault();
        const frente   = document.getElementById('f-frente').value.trim();
        const dorso    = document.getElementById('f-dorso').value.trim();
        const tema     = document.getElementById('f-tema').value.trim();
        const tagsRaw  = document.getElementById('f-tags').value.trim();
        const feedback = document.getElementById('form-feedback');

        if (!frente || !dorso) {
          feedback.textContent = 'El frente y el dorso son obligatorios.';
          feedback.className   = 'form-feedback error';
          return;
        }

        const tags    = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
        const newCard = {
          id:      `${materiaId}_${Date.now()}`,
          tema,
          frente,
          reverso: dorso,
          tags,
          srs: {
            easiness_factor: 2.5,
            interval:        1,
            repetitions:     0,
            next_review:     0,
          },
        };

        try {
          const updated = [...cards, newCard];
          await Storage.save(`flashcards/${materiaId}.json`, updated);
          cards = updated;

          feedback.textContent = '✓ Card agregada. Aparecerá en tu sesión de hoy.';
          feedback.className   = 'form-feedback';
          e.target.reset();

          // refrescar tab HOY si está activo
          if (document.querySelector('.tab-btn[data-tab="hoy"]').classList.contains('active')) {
            renderHoy();
          }
        } catch (err) {
          feedback.textContent = 'Error al guardar. Verificá que el servidor esté corriendo.';
          feedback.className   = 'form-feedback error';
        }
      });
    }

    // ── Tab GUÍA PRÁCTICA ────────────────────────────────────────────
    async function cargarGuias() {
      try {
        guiasData = await Storage.load(`guias/${materiaId}.json`);
      } catch (_) {
        guiasData = { guias: [] };
      }
    }

    function insertarTabGuias() {
      // insertar botón entre TEMAS y MATERIAL
      const temasBtn = document.querySelector('.tab-btn[data-tab="temas"]');
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.dataset.tab = 'guias';
      btn.setAttribute('role', 'tab');
      btn.textContent = 'GUÍA PRÁCTICA';
      temasBtn.insertAdjacentElement('afterend', btn);
      // insertar panel después de panel-temas
      const temasPanel = document.getElementById('panel-temas');
      const panel = document.createElement('div');
      panel.id = 'panel-guias';
      panel.className = 'tab-panel';
      temasPanel.insertAdjacentElement('afterend', panel);
    }

    function renderGuias() {
      const panel = document.getElementById('panel-guias');
      if (!panel || !guiasData) return;
      panel.innerHTML = guiasData.guias.map(g => renderGuia(g)).join('');
    }

    function renderGuia(g) {
      const total  = g.ejercicios.length;
      const hechos = g.ejercicios.filter(e => e.hecho).length;
      const pct    = total > 0 ? Math.round((hechos / total) * 100) : 0;
      const isOpen = openGuias.has(g.id);

      const listaHTML = total > 0
        ? `<ul class="ejercicios-list">${g.ejercicios.map(e => renderEjercicio(g.id, e)).join('')}</ul>`
        : `<p class="ejercicios-empty">Sin ejercicios críticos agregados.</p>`;

      const addHTML = formAbiertoGuia === g.id
        ? `<div class="form-agregar-ej">
             <input class="form-input" type="text" id="nuevo-nombre-${g.id}" placeholder="Nombre del ejercicio">
             <input class="form-input" type="text" id="nuevo-nota-${g.id}" placeholder="Nota (opcional)" style="margin-top:0.4rem">
             <div style="display:flex;gap:0.5rem;margin-top:0.6rem">
               <button class="btn-agregar" style="font-size:0.72rem;padding:0.4rem 1rem"
                       onclick="guardarNuevoEjercicio('${g.id}')">GUARDAR</button>
               <button class="btn-cancel-ej" onclick="cancelarAgregar('${g.id}')">CANCELAR</button>
             </div>
           </div>`
        : `<button class="btn-agregar-ej" onclick="mostrarFormAgregar('${g.id}')">+ Agregar ejercicio crítico</button>`;

      return `
        <div class="guia-item">
          <div class="guia-header" onclick="toggleGuia('${g.id}')">
            <div class="guia-header-left">
              <span class="guia-chevron ${isOpen ? 'open' : ''}">▶</span>
              <span class="guia-nombre">${g.nombre.toUpperCase()}</span>
            </div>
            <span class="guia-counter">${hechos}/${total}</span>
          </div>
          <div class="guia-progress-bar">
            <div class="guia-progress-fill" style="width:${pct}%"></div>
          </div>
          <div class="guia-body" style="display:${isOpen ? 'block' : 'none'}">
            ${listaHTML}
            ${addHTML}
          </div>
        </div>`;
    }

    function renderEjercicio(guiaId, ej) {
      const doneClass = ej.hecho ? 'done' : '';
      const notaHTML  = ej.nota
        ? `<span class="ejercicio-nota" onclick="editarNota('${guiaId}','${ej.id}',this)">${ej.nota}</span>`
        : `<span class="ejercicio-nota placeholder" onclick="editarNota('${guiaId}','${ej.id}',this)">Agregar nota...</span>`;
      return `
        <li class="ejercicio-item" id="ej-${ej.id}">
          <input type="checkbox" class="ejercicio-check" ${ej.hecho ? 'checked' : ''}
                 onchange="toggleEjercicio('${guiaId}','${ej.id}',this.checked)">
          <span class="ejercicio-nombre ${doneClass}">${ej.nombre}</span>
          ${notaHTML}
          <button class="btn-eliminar-ej" onclick="eliminarEjercicio('${guiaId}','${ej.id}')">×</button>
        </li>`;
    }

    // ── Acciones sobre guías ─────────────────────────────────────────
    function toggleGuia(guiaId) {
      if (openGuias.has(guiaId)) openGuias.delete(guiaId);
      else                       openGuias.add(guiaId);
      renderGuias();
      if (formAbiertoGuia === guiaId && !openGuias.has(guiaId)) {
        formAbiertoGuia = null;
      }
      // re-focus the add-form input if was open
      if (formAbiertoGuia === guiaId) {
        setTimeout(() => document.getElementById(`nuevo-nombre-${guiaId}`)?.focus(), 0);
      }
    }

    function toggleEjercicio(guiaId, ejId, checked) {
      const guia = guiasData.guias.find(g => g.id === guiaId);
      const ej   = guia?.ejercicios.find(e => e.id === ejId);
      if (!ej) return;
      ej.hecho = checked;
      Storage.save(`guias/${materiaId}.json`, guiasData).catch(console.error);
      renderGuias();
    }

    function eliminarEjercicio(guiaId, ejId) {
      const guia = guiasData.guias.find(g => g.id === guiaId);
      if (!guia) return;
      guia.ejercicios = guia.ejercicios.filter(e => e.id !== ejId);
      Storage.save(`guias/${materiaId}.json`, guiasData).catch(console.error);
      renderGuias();
    }

    function editarNota(guiaId, ejId, el) {
      const current = el.classList.contains('placeholder') ? '' : el.textContent;
      const input   = document.createElement('input');
      input.type        = 'text';
      input.value       = current;
      input.className   = 'ejercicio-nota-input';
      input.placeholder = 'Agregar nota...';
      el.replaceWith(input);
      input.focus();

      function guardar() {
        const guia = guiasData.guias.find(g => g.id === guiaId);
        const ej   = guia?.ejercicios.find(e => e.id === ejId);
        if (ej) ej.nota = input.value.trim();
        Storage.save(`guias/${materiaId}.json`, guiasData).catch(console.error);
        renderGuias();
      }
      input.addEventListener('blur', guardar);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter')  input.blur();
        if (e.key === 'Escape') renderGuias();
      });
    }

    function mostrarFormAgregar(guiaId) {
      formAbiertoGuia = guiaId;
      if (!openGuias.has(guiaId)) openGuias.add(guiaId);
      renderGuias();
      setTimeout(() => document.getElementById(`nuevo-nombre-${guiaId}`)?.focus(), 0);
    }

    function cancelarAgregar(guiaId) {
      formAbiertoGuia = null;
      renderGuias();
    }

    function guardarNuevoEjercicio(guiaId) {
      const nombreInput = document.getElementById(`nuevo-nombre-${guiaId}`);
      const notaInput   = document.getElementById(`nuevo-nota-${guiaId}`);
      const nombre = nombreInput?.value.trim();
      if (!nombre) { nombreInput?.focus(); return; }

      const guia = guiasData.guias.find(g => g.id === guiaId);
      if (!guia) return;

      guia.ejercicios.push({
        id:     `${guiaId}_${Date.now()}`,
        nombre,
        hecho:  false,
        nota:   notaInput?.value.trim() || '',
      });

      formAbiertoGuia = null;
      Storage.save(`guias/${materiaId}.json`, guiasData).catch(console.error);
      renderGuias();
    }

    // ── Init ─────────────────────────────────────────────────────────
    async function init() {
      // fecha
      const fechaStr = new Date().toLocaleDateString('es-AR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      });
      document.getElementById('dash-fecha').textContent =
        fechaStr.charAt(0).toUpperCase() + fechaStr.slice(1);

      try {
        const { materias } = await Storage.load('materias.json');
        materia = materias.find(m => m.id === materiaId);

        if (!materia) {
          document.body.innerHTML =
            `<p style="padding:2rem;font-family:Jost,sans-serif;color:#C0604A">
               Materia no encontrada: <strong>${materiaId}</strong>
             </p>`;
          return;
        }

        cards = await Storage.load(`flashcards/${materiaId}.json`).catch(() => []);

        // aplicar color de materia a toda la página
        document.body.style.setProperty('--c', materia.color);
        document.body.style.setProperty('--g', hexToRgba(materia.color, 0.15));

        document.getElementById('dash-titulo').textContent = materia.nombre.toUpperCase();
        document.title = `${materia.nombre} — StudyES`;

        if (materia.tiene_guias) {
          await cargarGuias();
          insertarTabGuias();
        }
        initTabs();
        renderHoy();
        renderTemas();
        if (materia.tiene_guias) renderGuias();
        renderAgregar();

        // activar tab desde URL (?tab=temas, etc.)
        const tabParam = params.get('tab');
        if (tabParam) {
          const btn = document.querySelector(`.tab-btn[data-tab="${tabParam}"]`);
          if (btn) btn.click();
        }

      } catch (err) {
        document.getElementById('panel-hoy').innerHTML =
          `<p class="empty-state">No se pudo conectar con el servidor.<br>
           Asegurate de que <code>start.bat</code> esté corriendo.</p>`;
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
